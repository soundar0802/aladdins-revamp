<script>
function setActiveNav() {

    let currentPage =
        window.location.pathname
            .split("/")
            .filter(Boolean)
            .pop();

    // If URL is:
    // /aladdins-revamp/
    // then currentPage will be "aladdins-revamp"
    //
    // We need to treat the folder root as index.html.

    if (
        !currentPage ||
        currentPage === "aladdins-revamp"
    ) {
        currentPage = "index.html";
    }


    const navLinks =
        document.querySelectorAll("#header .nav-link");


    navLinks.forEach(function (link) {

        const href =
            link.getAttribute("href");


        if (!href) return;


        // Get only the filename
        const linkPage =
            href
                .split("/")
                .filter(Boolean)
                .pop();


        // Remove previous active
        link.classList.remove("active");


        // ===============================
        // HOME
        // ===============================

        if (
            currentPage === "index.html" &&
            linkPage === "index.html"
        ) {

            link.classList.add("active");

        }


        // ===============================
        // OTHER PAGES
        // ===============================

        else if (
            currentPage === linkPage
        ) {

            link.classList.add("active");

        }

    });

}
</script>
