<body id="page-body">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5ZJ2MFF4"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Loader -->
    <div id="loader">
        <img src="./assets/videos/loading2.gif" alt="Loading..." width="100" />
    </div>
    <main>
        <!-- overlay -->
        <div class="page-overlay" id="overlay"></div>
        <!-- Header -->
       <div id="common-header"></div>

        <!-- contact us starts -->

        <!-- innner banner starts -->
        <section class="inner-ban">
            <div class="container">
                <div class="inner-ban-div">
                    <div class="row">
                        <h1>Contact Us</h1>
                    </div>
                </div>
            </div>
        </section>
        <!-- inner banner ends -->

        <!-- Contact section -->
        <section class="contact-section p-0">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-sm-7 col-11">
                        <div class="contact-card">
                            <div class="card-div">
                                <div class="img-icon">
                                    <img src="assets/images/contactus/placeholder.png" alt="Aladdin’s icon" class="img-fluid">
                                </div>
                                <div class="cont">
                                    <h5>Head Office</h5>
                                    <p>40 Lower High St,<br>
                                    Wednesbury,
                                    WS10 7AQ</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-sm-6 col-11">
                         <div class="contact-card">
                            <div class="card-div">
                                <div class="img-icon">
                                    <img src="assets/images/contactus/telephone.png" alt="Aladdin’s icon" class="img-fluid">
                                </div>
                                <div class="cont">
                                    <h5>Phone</h5>
                                    <p><a href="tel:0121 269 9043">0121 269 9043</a></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-sm-6 col-11">
                        <div class="contact-card">
                            <div class="card-div">
                                <div class="img-icon">
                                    <img src="assets/images/contactus/email.png" alt="Aladdin’s icon" class="img-fluid">
                                </div>
                                <div class="cont">
                                    <h5>Email</h5>
                                    <p><a href="mailto:support@aladdinspizza.co.uk">support@aladdinspizza.co.uk</a></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="container">
                <div class="row res-center">

                    <div class="col-lg-6">
                        <div class="card form-card">

                            <div class="row">
                                <div class="col-lg-12">
                                    <h3>Contact Us</h3>
                                    <p class="form-para">
                                        Please share your feedback using the form. <br>
                                        We are here to listen.
                                    </p>
                                </div>
                            </div>

                            <form action="" class="contact-form" id="contactForm" novalidate>

                                <!-- Honeypot field - hidden from real users -->
                                <div class="website-field" aria-hidden="true">
                                    <label for="website">Website</label>
                                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                                </div>

                                <!-- Form timestamp -->
                                <input type="hidden" id="form_time" name="form_time">
                                <div class="row">
                                    <!-- First Name -->
                                    <div class="col-lg-6">
                                        <div class="form">
                                            <label class="form-label" for="fname">
                                                First Name*
                                            </label>
                                            <input type="text" class="form-control" id="fname" name="fname" aria-describedby="fnameError" required placeholder="First Name*">
                                            <div id="fnameError" class="error-message" aria-live="polite"></div>
                                        </div>
                                    </div>

                                    <!-- Last Name -->
                                    <div class="col-lg-6">
                                        <div class="form">
                                            <label class="form-label" for="lname">
                                                Last Name
                                            </label>
                                            <input type="text" class="form-control" id="lname" name="lname" aria-describedby="lnameError"placeholder="Last Name">
                                            <div id="lnameError" class="error-message"aria-live="polite"></div>
                                        </div>
                                    </div>

                                    <!-- Phone Number -->
                                    <div class="col-lg-12">
                                        <div class="form">
                                            <label class="form-label" for="phnnumber">
                                                Phone Number
                                            </label>
                                            <input type="text" class="form-control" id="phnnumber" name="phnnumber" aria-describedby="phnError" placeholder="Phone Number">
                                            <div id="phnError" class="error-message" aria-live="polite"></div>
                                        </div>
                                    </div>

                                    <!-- Email -->
                                    <div class="col-lg-12">
                                        <div class="form">
                                            <label class="form-label" for="mail">
                                                Email Address*
                                            </label>
                                            <input type="email" class="form-control" id="mail" name="mail" aria-describedby="mailError" required placeholder="Email Address*">
                                            <div id="mailError" class="error-message" aria-live="polite"></div>
                                        </div>
                                    </div>

                                    <!-- Message -->
                                    <div class="col-lg-12">
                                        <div class="form">
                                            <label class="form-label" for="message">
                                                Message*
                                            </label>
                                            <textarea id="message" class="form-control" name="message" aria-describedby="msgError" rows="5" required placeholder="Message*"></textarea>
                                            <div id="msgError" class="error-message" aria-live="polite"></div>
                                        </div>
                                    </div>

                                    <!-- Status message (filled by assets/js/email.js) -->
                                    <div class="col-lg-12">
                                        <div id="contact-status" class="contact-status" role="status" aria-live="polite"></div>
                                    </div>

                                    <!-- Submit -->
                                    <div class="col-lg-12">
                                        <button type="submit" class="contact-btn">
                                            Submit
                                        </button>
                                    </div>

                                </div>
                            </form>

                        </div>
                    </div>

                    <div class="col-lg-6">
                        <img
                            src="assets/images/contactus/rght-img.jpg"
                            alt="Aladdin’s dish"
                            class="img-fluid rght-dish-img"
                        />
                    </div>

                </div>
            </div>
        </section>
        

        <!-- footer -->
        <div id="common-footer"></div>
    </main>


    <!-- Jquery -->
    <script src="./assets/plugins/jquery/slim.js"></script>
    <!-- bootstrap -->
    <script src="./assets/plugins/booststrap/js/main.js"></script>
    <script src="./assets/plugins/booststrap/js/popper.js"></script>
    <!-- font awesome -->
    <script src="./assets/plugins/font-awesome/all.min.js"></script>
    <!-- ionicons -->
    <!-- custome js -->
    <script src="./assets/js/script.js"></script>
    <!-- Common Js -->
    <script src="./assets/js/common.js"></script>
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./assets/js/email.js"></script>

</body>
</html>
